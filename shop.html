<body data-page="shop">
<a class="skip-link" href="#main">Skip to content</a>
<header data-chrome="header"></header>

<main id="main">
  <div class="wrap page-head">
    <p class="eyebrow">The Collection</p>
    <h1>Shop</h1>
    <p class="lead">Everything we make. Which is deliberately very little.</p>
  </div>
  <div class="wrap" style="padding-bottom:clamp(60px,9vw,120px)">
    <div class="toolbar">
      <div class="chips" id="shop-chips"></div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="shop-search" type="search" placeholder="Search pieces…" aria-label="Search products">
        </div>
        <span class="muted small" id="shop-count"></span>
      </div>
    </div>
    <div class="grid-3" id="shop-grid"></div>
  </div>
</main>

<footer data-chrome="footer"></footer>
